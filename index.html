<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>бУРСА</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/mobail.css">
</head>
<body>
       <div class="container">

        <h1>Натисни кнопку<br>
            <span>і дізнайся, чого тобі хочеться</span>
        </h1>

        <p class="subtitle">
            Просто натисни кнопку — і подивимось, що станеться...
        </p>

        <!-- КНОПКА -->
        <button class="magic-button" id="magicButton">
            <span class="star">✦</span>
            <span>Натисни<br>тут</span>
        </button>

    </div>

    <!-- ПОВІДОМЛЕННЯ -->
    <div class="popup" id="popup">
        <div class="popup-content">
            <div class="popup-icon">🎉</div>
            <h2>Попався!</h2>
            <p>Ти все-таки натиснув 😏</p>
            <button id="closePopup">Продовжити</button>
        </div>
    </div>

    <!-- МУЗИКА -->
    <audio id="music" src="img/music.mp3"></audio>
    <script src="js/script.js"></script>
</body>
</html>
